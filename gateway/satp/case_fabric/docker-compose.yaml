  satp-hermes-gateway-2:
    image: tomassilva2187/satp-gateway:2026-02-02-1458
    platform: linux/amd64
    privileged: true
    volumes:
      - ./config/gateway-2-config.json:/opt/cacti/satp-hermes/config/config.json
      - ./satp-hermes-gateway/gateway-2/logs:/opt/cacti/satp-hermes/logs
      - ./ontologies/:/opt/cacti/satp-hermes/ontologies/
      - ../../../fabric-samples:/fabric-samples:ro
      - ./config/core.yaml:/opt/cacti/satp-hermes/config/core.yaml:ro
      - ./config/fabric-connection-profile.json:/opt/cacti/satp-hermes/config/fabric-connection-profile.json
    ports:
      - 3110:3010/tcp # SERVER_PORT
      - 3111:3011/tcp # CLIENT_PORT
      - 4110:4010/tcp # OAPI_PORT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fabric_test 
    environment:
      - NODE_ENV=development
networks:
  fabric_test:
    external: true
